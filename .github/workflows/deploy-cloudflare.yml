name: Deploy to Cloudflare

on:
  workflow_dispatch:
  # 定時実行(update.yml)は GITHUB_TOKEN で git push するため、GitHub Actions の仕様上
  # そのpushは他ワークフローの push トリガーを発火できない（無限ループ防止のための制限）。
  # そのため workflow_run（Daily Update完了）を主経路として維持しつつ、
  # 手動push（このセッションからのgit push等、個人認証情報を使うもの）を
  # 確実に拾うため push トリガーも併用する。
  workflow_run:
    workflows: ["Daily Update"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - "index.html"
      - "data/**"
      - "favicon.svg"
      - "*.png"
      - "manifest.json"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 035926d851c17dfd9cf096e0884cd474
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare deploy."
            exit 0
          fi
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude .git --exclude .github --exclude scripts --exclude '*.py' --exclude requirements.txt --exclude README.md
          npx wrangler@4 pages deploy /tmp/site --project-name=holdings-radar --branch=main --commit-dirty=true