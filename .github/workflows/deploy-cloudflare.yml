name: Deploy to Cloudflare

on:
  workflow_dispatch:
  # master へのコンテンツpush（定時実行のコミット・手動データ修正・パッチ適用いずれも）で
  # 確実にデプロイする。以前は workflow_run(Daily Update完了) 依存だったが、
  # update.yml が push イベント自体では意図的に skip される仕様のため、
  # 手動push時に「Daily Updateが成功していない」と誤判定されCloudflareだけ
  # 取り残されるバグがあった。push トリガーならGitHub Pagesと同じ確実さになる。
  push:
    branches: [master]
    paths:
      - "index.html"
      - "data/**"
      - "favicon.svg"
      - "*.png"
      - "manifest.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 035926d851c17dfd9cf096e0884cd474
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare deploy."
            exit 0
          fi
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude .git --exclude .github --exclude scripts --exclude '*.py' --exclude requirements.txt --exclude README.md
          npx wrangler@4 pages deploy /tmp/site --project-name=holdings-radar --branch=main --commit-dirty=true