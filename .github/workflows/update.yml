name: Daily Update

on:
  # push で index.html が更新されたとき GitHub Pages を自動ビルド
  push:
    branches: [master]
    paths:
      - "index.html"
      - "favicon.svg"
      - "companies_cache.json"

  # 手動 or スケジュール実行（EDINET_API_KEY が設定されていれば GitHub Actions からも動く）
  schedule:
    # 平日 19:00 JST = 10:00 UTC
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 (YYYY-MM-DD) — 空欄で直近営業日"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # push イベント以外（手動/スケジュール）のときのみ実行
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests pypdf

      # ① 大量保有データ取得（最優先・速い）
      - name: Run fetch
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python scripts/fetch.py

      # ② 大量保有データを先にコミット（ワラント監視が失敗/遅延しても確実に反映）
      - name: Commit holdings
        run: |
          git config user.name  "holdings-radar[bot]"
          git config user.email "holdings-radar[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "No holdings changes"
          else
            DATE=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d'))")
            git commit -m "chore: update holdings data ${DATE}"
            git pull --rebase
            git push
          fi

      # ③ MSワラント行使ウォッチ（日次リフレッシュ＝既知ワラント+当日銘柄のみ・約6分）
      #   失敗時は warrants.json を更新せず既存データを保持する設計
      - name: Warrant watch
        continue-on-error: true
        run: python scripts/warrant_watch.py --refresh

      - name: Commit warrants
        run: |
          git config user.name  "holdings-radar[bot]"
          git config user.email "holdings-radar[bot]@users.noreply.github.com"
          python scripts/fetch.py --regen-only 2>/dev/null || python scripts/fetch.py
          git add index.html data/warrants.json
          if git diff --staged --quiet; then
            echo "No warrant changes"
          else
            git commit -m "chore: update warrant watch"
            git pull --rebase
            git push
          fi
